<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth Blockers Scorecard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column, sticky progress bar, six blocker sections, then a results view that ranks them weakest first */
:root {
  --bg: #f3f7f8;
  --surface: #ffffff;
  --fg: #12262c;
  --muted: #536a71;
  --line: #d5e1e4;
  --accent: #14778c;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1f4;
  --bad: #b83a2b;
  --bad-soft: #fbe9e6;
  --warn: #9a6408;
  --warn-soft: #fbf0d9;
  --good: #1b7a58;
  --good-soft: #def3ea;
  --font-display: 'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c191d;
    --surface: #13252b;
    --fg: #e6f0f2;
    --muted: #9ab0b6;
    --line: #27434b;
    --accent: #4fb4c9;
    --accent-ink: #06202a;
    --accent-soft: #17323a;
    --bad: #f0806f;
    --bad-soft: #3a1f1c;
    --warn: #e5b24f;
    --warn-soft: #382b12;
    --good: #52c99a;
    --good-soft: #14352a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c191d;
  --surface: #13252b;
  --fg: #e6f0f2;
  --muted: #9ab0b6;
  --line: #27434b;
  --accent: #4fb4c9;
  --accent-ink: #06202a;
  --accent-soft: #17323a;
  --bad: #f0806f;
  --bad-soft: #3a1f1c;
  --warn: #e5b24f;
  --warn-soft: #382b12;
  --good: #52c99a;
  --good-soft: #14352a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 760px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px 8px; flex-wrap: wrap; }
.kicker { color: var(--muted); font-size: 14px; letter-spacing: .02em; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.intro { padding-block: 16px 20px; display: grid; gap: 12px; }
.intro h1 { font-size: clamp(28px, 6vw, 40px); color: var(--accent); }
.intro p { color: var(--muted); max-width: 62ch; }
.privacy { font-size: 14px; }

.progress { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); }
.progress-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }

.section { margin-top: 28px; display: grid; gap: 12px; }
.section-head { display: grid; gap: 2px; }
.section-head .tag { font-size: 13px; color: var(--accent); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.section-head h2 { font-size: 22px; }
.section-head p { color: var(--muted); font-size: 15px; }

.q { margin: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.q legend { padding: 0; float: left; width: 100%; font-weight: 500; }
.q legend + * { clear: both; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opt { position: relative; display: block; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span { display: block; text-align: center; padding: 9px 6px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--bg); color: var(--fg); }
.opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 12px 22px; border-radius: 10px; font-weight: 600; }
.btn[disabled] { background: transparent; color: var(--muted); border-color: var(--line); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.hint { color: var(--muted); font-size: 14px; }

.result-head { margin-top: 28px; display: grid; gap: 8px; }
.score-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.score-num { font-family: var(--font-display); font-size: 56px; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.score-num small { font-size: 22px; color: var(--muted); font-weight: 600; }
.score-text { display: grid; gap: 2px; min-width: 0; flex: 1 1 220px; }
.score-text strong { font-family: var(--font-display); font-size: 19px; }
.score-text span { color: var(--muted); font-size: 14px; }

.bars { margin-top: 24px; display: grid; gap: 14px; }
.bar-row { display: grid; gap: 6px; }
.bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bar-name { font-weight: 600; }
.bar-score { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.pill { padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.bar-track { height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; }
.bar-fill.bad { background: var(--bad); }
.bar-fill.warn { background: var(--warn); }
.bar-fill.good { background: var(--good); }

.focus { margin-top: 32px; display: grid; gap: 14px; }
.focus h2 { font-size: 22px; }
.advice { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.advice h3 { font-size: 18px; }
.advice dt { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .03em; text-transform: uppercase; }
.advice dd { margin: 0 0 6px; }
.advice dl { margin: 0; }
.ok { background: var(--good-soft); color: var(--good); padding: 14px 16px; border-radius: 12px; font-weight: 500; }

.cta { margin-top: 32px; background: var(--accent-soft); border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
.cta h3 { font-size: 19px; }
.cta .row { display: flex; flex-wrap: wrap; gap: 12px; }
.cta a.btn { text-decoration: none; display: inline-block; }
.note { margin-top: 20px; font-size: 13px; color: var(--muted); }
textarea.fallback { width: 100%; min-height: 150px; font: inherit; font-size: 14px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }

@media (max-width: 420px) {
  .score-num { font-size: 46px; }
  .opt span { font-size: 14px; padding-inline: 2px; }
}
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>

    var h = header(t);
    h += '<div class="intro"><h1>' + esc(t.title) + '</h1><p>' + esc(t.intro) + '</p><p class="privacy">' + esc(t.privacy) + '</p></div>';
    h += '<div class="progress"><div class="progress-row"><span id="pcount">' + esc(t.answered(n)) + '</span></div><div class="track"><div class="fill" id="pfill" style="width:' + (n / 18 * 100) + '%"></div></div></div>';
    t.blockers.forEach(function (b, bi) {
      h += '<section class="section"><div class="section-head"><span class="tag">' + esc(t.areaLabel) + ' ' + (bi + 1) + ' / 6</span><h2>' + esc(b.name) + '</h2><p>' + esc(b.desc) + '</p></div>';
      b.qs.forEach(function (q, qi) {
        var key = 'q' + bi + '_' + qi;
        h += '<fieldset class="q"><legend>' + esc(q) + '</legend><div class="opts">';
        t.opts.forEach(function (o, oi) {
          var id = key + '_' + oi;
          h += '<label class="opt" for="' + id + '"><input type="radio" id="' + id + '" name="' + key + '" value="' + oi + '"' + (String(state.answers[key]) === String(oi) ? ' checked' : '') + '><span>' + esc(o) + '</span></label>';
        });
        h += '</div></fieldset>';
      });
      h += '</section>';
    });
    h += '<div class="actions"><button type="button" class="btn" id="show"' + (n < 18 ? ' disabled' : '') + '>' + esc(t.show) + '</button><span class="hint" id="hint">' + (n < 18 ? esc(t.remaining(18 - n)) : '') + '</span></div>';
    h += '<p class="note">' + esc(t.note) + '</p>';
    app.innerHTML = h;
  }

  function resultsText(t, sc, total) {
    var lines = [t.copyHead + ': ' + total + '/36'];
    sc.slice().sort(function (a, b) { return a.score - b.score || a.bi - b.bi; }).forEach(function (s) {
      lines.push(s.name + ': ' + s.score + '/6 (' + t.pills[s.level] + ')');
    });
    return lines.join('\n');
  }

  function renderResults(t) {
    var sc = scores();
    var total = sc.reduce(function (a, s) { return a + s.score; }, 0);
    var pct = total / 36;
    var band = pct < 0.45 ? 0 : (pct < 0.7 ? 1 : 2);
    var sorted = sc.slice().sort(function (a, b) { return a.score - b.score || a.bi - b.bi; });
    var cls = ['bad', 'warn', 'good'];
    var h = header(t);
    h += '<div class="result-head"><h1 style="font-size:clamp(26px,5vw,34px);color:var(--accent)">' + esc(t.resultsTitle) + '</h1>';
    h += '<div class="score-card"><div class="score-num">' + total + '<small> / 36</small></div><div class="score-text"><strong>' + esc(t.bands[band]) + '</strong><span>' + esc(t.overall) + '</span></div></div></div>';
    h += '<div class="bars">';
    sorted.forEach(function (s) {
      h += '<div class="bar-row"><div class="bar-top"><span class="bar-name">' + esc(s.name) + '</span><span class="bar-score">' + s.score + ' / 6 <span class="pill ' + cls[s.level] + '">' + esc(t.pills[s.level]) + '</span></span></div>' +
        '<div class="bar-track" role="img" aria-label="' + esc(s.name + ': ' + s.score + '/6') + '"><div class="bar-fill ' + cls[s.level] + '" style="width:' + (s.score / 6 * 100) + '%"></div></div></div>';
    });
    h += '</div>';
    var needs = sorted.filter(function (s) { return s.score <= 4; }).slice(0, 2);
    h += '<div class="focus"><h2>' + esc(t.focusTitle) + '</h2>';
    if (!needs.length) {
      h += '<p class="ok">' + esc(t.allGood) + '</p>';
    } else {
      needs.forEach(function (s) {
        var b = t.blockers[s.bi];
        h += '<div class="advice"><h3>' + esc(b.name) + '</h3><dl><dt>' + esc(t.look) + '</dt><dd>' + esc(b.look) + '</dd><dt>' + esc(t.step) + '</dt><dd>' + esc(b.step) + '</dd></dl></div>';
      });
    }
    h += '</div>';
    h += '<div class="actions"><button type="button" class="btn" id="copy">' + esc(state.copied ? t.copied : t.copy) + '</button><button type="button" class="btn ghost" id="edit">' + esc(t.edit) + '</button><button type="button" class="btn ghost" id="again">' + esc(t.again) + '</button></div>';
    if (state.copyText) {
      h += '<div style="margin-top:12px"><label class="hint" for="fb">' + esc(t.fallbackLabel) + '</label><textarea class="fallback" id="fb" readonly>' + esc(state.copyText) + '</textarea></div>';
    }
    h += '<div class="cta"><h3>' + esc(t.ctaTitle) + '</h3><p>' + esc(t.ctaText) + '</p><div class="row"><a class="btn" href="' + PROFILE + '" target="_blank" rel="noopener">' + esc(t.ctaBtn) + '</a></div></div>';
    h += '<p class="note">' + esc(t.note) + '</p>';
    app.innerHTML = h;
    state._text = resultsText(t, sc, total);
  }

  function render(scrollTop) {
    var t = D[state.lang];
    document.documentElement.lang = t.lang;
    app.setAttribute('dir', t.dir);
    document.title = t.title;
    if (state.view === 'form') renderForm(t); else renderResults(t);
    if (scrollTop) { try { window.scrollTo({ top: 0 }); } catch (e) { window.scrollTo(0, 0); } }
  }

  function updateProgress() {
    var t = D[state.lang], n = count();
    var pc = document.getElementById('pcount'), pf = document.getElementById('pfill'), btn = document.getElementById('show'), hint = document.getElementById('hint');
    if (pc) pc.textContent = t.answered(n);
    if (pf) pf.style.width = (n / 18 * 100) + '%';
    if (btn) btn.disabled = n < 18;
    if (hint) hint.textContent = n < 18 ? t.remaining(18 - n) : '';
  }

  app.addEventListener('change', function (e) {
    var el = e.target;
    if (el && el.type === 'radio') { state.answers[el.name] = el.value; updateProgress(); }
  });

  app.addEventListener('click', function (e) {
    var b = e.target.closest('button, a');
    if (!b) return;
    if (b.dataset && b.dataset.lang) {
      state.lang = b.dataset.lang;
      try { localStorage.setItem('gbs-lang', state.lang); } catch (err) {}
      render(false);
      return;
    }
    if (b.id === 'show' && count() === 18) { state.view = 'results'; state.copied = false; state.copyText = null; render(true); }
    else if (b.id === 'edit') { state.view = 'form'; render(true); }
    else if (b.id === 'again') { state.answers = {}; state.view = 'form'; state.copied = false; state.copyText = null; render(true); }
    else if (b.id === 'copy') {
      var txt = state._text;
      var done = function () { state.copied = true; state.copyText = null; render(false); };
      var fail = function () { state.copyText = txt; render(false); var f = document.getElementById('fb'); if (f) { f.focus(); f.select(); } };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fail); else fail();
      } catch (err) { fail(); }
    }
  });

  render(false);
})();
</script>
</body>
</html>
